name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Testlar bots.json va bots/ papkalari mosligini, .env.example borligini
      # va .env commit qilinmaganini tekshiradi.
      - name: Testlar
        run: npm test
      # Repo public — kalit qolib ketmaganiga ishonch hosil qilamiz.
      - name: Kalit tekshiruvi
        run: npm run scan
